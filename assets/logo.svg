<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none">
  <defs>
    <linearGradient id="goldOven" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="40%" stop-color="#E5A93C"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.5)"/>
    </filter>
  </defs>

  <!-- Exact Emblem from Mister Bnine Stone Pizza Oven -->
  <g transform="translate(10, 10)" filter="url(#shadow)">
    <!-- Dark oven steel plate backing -->
    <rect width="100" height="100" rx="50" fill="#141416" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    
    <!-- Outer Stencil Ring (Open at left and right sides like the oven cutout) -->
    <!-- Top Arc -->
    <path d="M 22 45 A 38 38 0 0 1 78 45" fill="none" stroke="url(#goldOven)" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Bottom Arc -->
    <path d="M 78 55 A 38 38 0 0 1 22 55" fill="none" stroke="url(#goldOven)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Chef Hat Inside Upper Half -->
    <path d="M 36 43 C 33 37 36 30 42 30 C 44 24 56 24 58 30 C 64 30 67 37 64 43 Z" fill="url(#goldOven)"/>
    <!-- Chef Hat Base Band -->
    <rect x="37" y="44" width="26" height="3" rx="1.5" fill="url(#goldOven)"/>

    <!-- Letters "M" and "B" (Mister Bnine) in Signature Cursive Serif -->
    <text x="35" y="70" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="bold" font-style="italic" fill="url(#goldOven)">M</text>
    <text x="53" y="70" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="bold" font-style="italic" fill="url(#goldOven)">B</text>
  </g>

  <!-- Typography -->
  <g transform="translate(126, 26)">
    <!-- Subtitle -->
    <text x="4" y="16" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="3.5" fill="#E5A93C" text-transform="uppercase">RESTO • FAST-FOOD • GRILL</text>
    
    <!-- Main Brand Name -->
    <text x="2" y="52" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="36" font-weight="900" letter-spacing="-0.5" fill="#FFFFFF">
      MISTER <tspan fill="url(#goldOven)">BNINE</tspan>
    </text>
    
    <!-- Arabic Baseline Location -->
    <text x="4" y="76" font-family="'Alexandria', 'Cairo', sans-serif" font-size="13" font-weight="600" letter-spacing="0.5" fill="rgba(255,255,255,0.7)">
      مـسـتـر بـنـيـن • دشـيـرة الـجـهـاديـة
    </text>
  </g>
</svg>
