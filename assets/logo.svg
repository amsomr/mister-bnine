<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" fill="none">
  <defs>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5500"/>
      <stop offset="50%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#FFC700"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD666"/>
      <stop offset="100%" stop-color="#FFA114"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Emblem Icon (Double Bezel squircle) -->
  <g transform="translate(10, 10)">
    <!-- Outer Shell -->
    <rect width="100" height="100" rx="26" fill="#1C1C1F" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <rect x="4" y="4" width="92" height="92" rx="22" fill="#121214"/>
    
    <!-- Subtle glow orb -->
    <circle cx="50" cy="50" r="28" fill="url(#flameGrad)" opacity="0.25" filter="url(#glow)"/>
    
    <!-- Chef Hat + Flame / Burger B Silhouette -->
    <!-- Chef Hat Base -->
    <path d="M34 58 C34 55 66 55 66 58 L64 64 C64 65 36 65 36 64 Z" fill="url(#goldGrad)"/>
    <!-- Chef Hat Puffs -->
    <path d="M33 55 C27 52 28 42 36 40 C36 32 46 28 50 32 C54 28 64 32 64 40 C72 42 73 52 67 55 Z" fill="url(#flameGrad)"/>
    
    <!-- Stylized Dapper Mustache (Mister touch) -->
    <path d="M50 72 C46 68 38 69 34 73 C37 77 45 77 50 74 C55 77 63 77 66 73 C62 69 54 68 50 72 Z" fill="#FFFFFF"/>
    
    <!-- Crown star / Sparkle -->
    <circle cx="72" cy="28" r="3" fill="#FFC700"/>
  </g>

  <!-- Typography -->
  <g transform="translate(130, 24)">
    <!-- Subtitle / Tagline Arabic & French -->
    <text x="4" y="20" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="3.5" fill="#FF8A00" text-transform="uppercase">RESTO • FAST-FOOD • DCHEIRA</text>
    
    <!-- Brand Name -->
    <text x="2" y="56" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5" fill="#FFFFFF">
      MISTER <tspan fill="url(#goldGrad)">BNINE</tspan>
    </text>
    
    <!-- Arabic Script Calligraphy Touch -->
    <text x="3" y="77" font-family="'Alexandria', 'Cairo', sans-serif" font-size="13" font-weight="600" letter-spacing="0.5" fill="rgba(255,255,255,0.65)">
      مـسـتـر بـنـيـن • الـمـذاق الأصـيـل
    </text>
  </g>
</svg>
